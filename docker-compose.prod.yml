# Production overrides for a small VPS (1-2 GB RAM).
# Enabled by COMPOSE_FILE in .env (written by scripts/deploy-vps.sh).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Low-memory MySQL: ~200 MB instead of ~400 MB
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --max-connections=50
    # Do not expose MySQL to the internet
    ports: !reset []
    logging: *logging

  backend:
    logging: *logging

  web:
    logging: *logging
