<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Yein Admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="center hidden">
    <form id="login-form" class="box">
      <h1>Yein Admin</h1>
      <label>Tài khoản <input name="username" autocomplete="username" required /></label>
      <label>Mật khẩu <input name="password" type="password" autocomplete="current-password" required /></label>
      <p id="login-error" class="error"></p>
      <button type="submit">Đăng nhập</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="app-view" class="hidden">
    <header class="topbar">
      <strong>Yein Admin</strong>
      <div>
        <span id="who"></span>
        <button id="btn-password" class="ghost">Đổi mật khẩu</button>
        <button id="btn-logout" class="ghost">Đăng xuất</button>
      </div>
    </header>

    <main class="wrap">
      <div class="toolbar">
        <h2>Sản phẩm</h2>
        <button id="btn-new">+ Thêm sản phẩm</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Thứ tự</th><th>Ảnh</th><th>Tên</th><th>Giá</th><th>Giá KM</th><th>Hiển thị</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
  </section>

  <!-- Product dialog -->
  <dialog id="product-dialog">
    <form id="product-form" method="dialog" class="box">
      <h3 id="dialog-title">Sản phẩm</h3>
      <input type="hidden" name="id" />
      <label>Tên * <input name="name" required /></label>
      <label>Mô tả <textarea name="description" rows="3"></textarea></label>
      <div class="row">
        <label>Giá (VND) * <input name="price" type="number" min="0" step="1000" required /></label>
        <label>Giá khuyến mãi <input name="sale_price" type="number" min="0" step="1000" /></label>
      </div>
      <label>Link ảnh <input name="image_url" type="url" placeholder="https://..." /></label>
      <div class="row">
        <label>Thứ tự <input name="sort_order" type="number" value="0" /></label>
        <label class="check"><input name="is_active" type="checkbox" checked /> Hiển thị trên web</label>
      </div>
      <p id="product-error" class="error"></p>
      <div class="actions">
        <button type="button" class="ghost" id="btn-cancel">Huỷ</button>
        <button type="submit" value="save">Lưu</button>
      </div>
    </form>
  </dialog>

  <!-- Password dialog -->
  <dialog id="password-dialog">
    <form id="password-form" method="dialog" class="box">
      <h3>Đổi mật khẩu</h3>
      <label>Mật khẩu hiện tại <input name="currentPassword" type="password" required /></label>
      <label>Mật khẩu mới (≥ 8 ký tự) <input name="newPassword" type="password" minlength="8" required /></label>
      <p id="password-error" class="error"></p>
      <div class="actions">
        <button type="button" class="ghost" id="btn-password-cancel">Huỷ</button>
        <button type="submit">Lưu</button>
      </div>
    </form>
  </dialog>

  <script src="/admin/admin.js"></script>
</body>
</html>
